{% extends "base.html" %}{% block title %}Register | CloudPass{% endblock %}{% block content %}
<section class="form-wrap"><div class="form-intro"><span class="eyebrow">JOIN CLOUDPASS</span><h1>Create your account</h1><p>Register to apply for bus passes and view your booking history.</p></div>
<form class="form-card" method="post"><label>Full name<input name="name" required maxlength="100" autocomplete="name"></label><label>Email address<input name="email" type="email" required autocomplete="email"></label><label>Password<input name="password" type="password" minlength="8" required autocomplete="new-password"><small>Use at least 8 characters.</small></label><button class="button full" type="submit">Create account</button><p class="form-note">Already registered? <a href="{{ url_for('login') }}">Log in</a></p></form></section>
{% endblock %}
